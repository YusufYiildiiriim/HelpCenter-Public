name: HelpCenterDev

services:
  db:
    container_name: helpcenter-db-dev
    build:
      context: .
      dockerfile: Dockerfile.sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?SA_PASSWORD is not set — copy .env.example to .env}"
    volumes:
      - helpcenter-db-data:/var/opt/mssql
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      - helpcenter-network
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  helpcenter.webapi:
    container_name: helpcenter-api-dev
    build:
      context: ../help-center-backend
      dockerfile: HelpCenter.WebApi/Dockerfile
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=db;Database=HelpCenterDb;User Id=sa;Password=${SA_PASSWORD:?SA_PASSWORD is not set — copy .env.example to .env};TrustServerCertificate=True;"
      JwtSettings__SecretKey: "${JwtSettings__SecretKey:?JwtSettings__SecretKey is not set — copy .env.example to .env}"
      AppSettings__FrontendUrl: "${AppSettings__FrontendUrl:?AppSettings__FrontendUrl is not set — copy .env.example to .env}"
      SmtpSettings__Host: "${SmtpSettings__Host:?SmtpSettings__Host is not set — copy .env.example to .env}"
      SmtpSettings__Port: "${SmtpSettings__Port:?SmtpSettings__Port is not set — copy .env.example to .env}"
      SmtpSettings__Username: "${SmtpSettings__Username:?SmtpSettings__Username is not set — copy .env.example to .env}"
      SmtpSettings__Password: "${SmtpSettings__Password:?SmtpSettings__Password is not set — copy .env.example to .env}"
      SmtpSettings__FromAddress: "${SmtpSettings__FromAddress:?SmtpSettings__FromAddress is not set — copy .env.example to .env}"
      SmtpSettings__DisplayName: "${SmtpSettings__DisplayName:?SmtpSettings__DisplayName is not set — copy .env.example to .env}"
      SmtpSettings__EnableSsl: "${SmtpSettings__EnableSsl:?SmtpSettings__EnableSsl is not set — copy .env.example to .env}"
    volumes:
      - ../help-center-backend/HelpCenter.WebApi/Uploads:/app/Uploads
      - ../help-center-backend/HelpCenter.WebApi/wwwroot:/app/wwwroot
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpcenter-network
    restart: always

  helpcenter.ui:
    container_name: helpcenter-ui-dev
    build:
      context: ../help-center-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is not set — copy .env.example to .env}"
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is not set — copy .env.example to .env}"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
    depends_on:
      - helpcenter.webapi
    networks:
      - helpcenter-network
    restart: always

volumes:
  helpcenter-db-data:

networks:
  helpcenter-network:
    driver: bridge
